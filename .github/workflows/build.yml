          import androidx.compose.ui.unit.dp
          import androidx.core.view.WindowCompat

          class MainActivity : ComponentActivity() {
              private lateinit var store: Store

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  store = Store(applicationContext)
                  setContent { App(store, ::launchGame) }
              }

              override fun onResume() {
                  super.onResume()
                  store.finishSession()      // добавить время сессии
                  restoreBrightness()
              }

              private fun launchGame(g: GameItem) {
                  store.recordLaunch(g.pkg)
                  val intent = packageManager.getLaunchIntentForPackage(g.pkg)
                  if (intent == null) {
                      val msg = if (g.pkg.startsWith("demo.")) "Демо-игра — установите настоящие игры" else "Не удалось запустить"
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                      store.finishSession()
                      return
                  }
                  applyProfile(g.pkg)
                  startActivity(intent)
              }

              private fun applyProfile(pkg: String) {
                  val vol = store.volume(pkg)
                  if (vol >= 0) {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, vol * am.getStreamMaxVolume(AudioManager.STREAM_MUSIC) / 100, 0)
                  }
                  val br = store.brightness(pkg)
                  if (br >= 0 && Settings.System.canWrite(this)) {
                      runCatching {
                          val prev = Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, 128)
                          if (store.savedBrightness < 0) store.savedBrightness = prev
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL)
                          Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, br * 255 / 100)
                      }
                  }
              }

              private fun restoreBrightness() {
                  val prev = store.savedBrightness
                  if (prev >= 0 && Settings.System.canWrite(this)) {
                      runCatching { Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, prev) }
                      store.savedBrightness = -1
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class, ExperimentalLayoutApi::class)
          @Composable
          fun App(s: Store, launch: (GameItem) -> Unit) {
              val t = THEMES[s.theme]
              var screen by rememberSaveable { mutableStateOf(Screen.Hub) }
              var libTab by rememberSaveable { mutableIntStateOf(0) }
              var menu by rememberSaveable { mutableStateOf(false) }

              LaunchedEffect(s.showAll) { s.refresh() }
              BackHandler(screen != Screen.Hub) { screen = Screen.Hub }

              val view = LocalView.current
              SideEffect {
                  val w = (view.context as Activity).window
                  val c = WindowCompat.getInsetsController(w, view)
                  c.isAppearanceLightStatusBars = t.kind == 0
                  c.isAppearanceLightNavigationBars = t.kind == 0
              }

              val go: (Screen) -> Unit = { screen = it }
              val open: () -> Unit = { menu = true }

              CompositionLocalProvider(LocalT provides t, LocalLang provides s.lang) {
                  Box(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(t.bgTop, t.bgBottom)))) {
                      if (t.kind != 0) Canvas(Modifier.fillMaxSize()) {
                          drawCircle(
                              Brush.radialGradient(listOf(t.accent.copy(alpha = 0.28f), Color.Transparent), Offset(size.width * 0.8f, size.height * 0.2f), size.width * 0.7f),
                              size.width * 0.7f, Offset(size.width * 0.8f, size.height * 0.2f),
                          )
                      }
                      if (screen == Screen.Hub) {
                          HubScreen(s, go, open, launch)
                      } else {
                          Column(Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding().padding(horizontal = 16.dp)) {
                              Box(Modifier.weight(1f)) {
                                  when (screen) {
                                      Screen.Library -> LibraryScreen(s, libTab, go, open, launch)
                                      Screen.Profile -> ProfileScreen(s, go, open)
                                      Screen.Wave -> WaveScreen(s, go, open)
                                      Screen.Themes -> ThemesScreen(s, go, open)
                                      Screen.Settings -> SettingsScreen(s, go, open)
                                      Screen.Hub -> {}
                                  }
                              }
                              MiniBar(s, launch) { screen = Screen.Hub }
                          }
                      }
                      if (menu) {
                          ModalBottomSheet(
                              onDismissRequest = { menu = false },
                              containerColor = if (t.kind == 0) Color.White else Color(0xFF1B1520),
                          ) {
                              FlowRow(
                                  Modifier.padding(16.dp).navigationBarsPadding(),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                                  verticalArrangement = Arrangement.spacedBy(8.dp),
                              ) {
                                  fun nav(sc: Screen, tab: Int = 0) { libTab = tab; screen = sc; menu = false }
                                  MayChip(tr("Главная", "Home"), { nav(Screen.Hub) }, icon = Icons.Rounded.Home)
                                  MayChip(tr("Профиль запуска", "Launch profile"), { nav(Screen.Profile) }, icon = Icons.Rounded.Tune)
                                  MayChip(tr("Библиотека", "Library"), { nav(Screen.Library) }, icon = Icons.Rounded.Search)
                                  MayChip(tr("Очередь", "Queue"), { nav(Screen.Library, 2) }, icon = Icons.Rounded.PlaylistAdd)
                                  MayChip(tr("Любимое", "Favorites"), { nav(Screen.Library, 1) }, icon = Icons.Rounded.Favorite)
                                  MayChip(tr("Моя подборка", "My mix"), { nav(Screen.Wave) }, icon = Icons.Rounded.Waves)
                                  MayChip(tr("Скрытые", "Hidden"), { nav(Screen.Library, 3) }, icon = Icons.Rounded.VisibilityOff)
                                  MayChip(tr("Темы", "Themes"), { nav(Screen.Themes) }, icon = Icons.Rounded.Palette)
                                  MayChip(tr("Настройки", "Settings"), { nav(Screen.Settings) }, icon = Icons.Rounded.Settings)
                              }
                          }
                      }
                  }
              }
          }
