          enum class Screen { Hub, Library, Profile, Wave, Themes, Settings }

          private fun genreLabel(lang: String, g: String) =
              if (lang == "ru") g else GENRES_EN[GENRES.indexOf(g).coerceAtLeast(0)]

          // =============================== HUB ===============================

          @Composable
          fun HubScreen(s: Store, go: (Screen) -> Unit, onMenu: () -> Unit, launch: (GameItem) -> Unit) {
              val t = LocalT.current
              val cur = s.currentGame()
              val played = cur?.let { s.playtime[it.pkg] } ?: 0L
              val goalMs = listOf(1, 5, 10, 25, 50, 100, 250, 500).map { it * 3_600_000L }
                  .firstOrNull { it > played } ?: (500 * 3_600_000L)

              Column(Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding().padding(horizontal = 16.dp)) {
                  TopBar(
                      tr("Сейчас играет", "Now playing"), onMenu,
                      right = Icons.Rounded.SwapHoriz, onRight = { s.setHand(!s.rightHand) },
                  )
                  Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {
                      WaveCover(Modifier.fillMaxHeight(0.95f).aspectRatio(1f)) {
                          GameIcon(cur, 96.dp)
                          Column(Modifier.align(Alignment.BottomStart).padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              SoftButton(Icons.Rounded.ThumbDown, { cur?.let { s.hidden.toggle(it.pkg); s.next() } }, size = 36.dp)
                              SoftButton(
                                  if (cur != null && cur.pkg in s.favs) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder,
                                  { cur?.let { s.favs.toggle(it.pkg) } }, size = 36.dp,
                                  active = cur != null && cur.pkg in s.favs,
                              )
                          }
                          SoftButton(Icons.Rounded.Tune, { go(Screen.Profile) }, Modifier.align(Alignment.BottomEnd).padding(12.dp), size = 36.dp)
                      }
                  }
                  Column(Modifier.fillMaxWidth().padding(top = 10.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(
                          cur?.name ?: tr("Игр не найдено", "No games found"), color = t.text, fontSize = 22.sp,
                          fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis,
                      )
                      Text(cur?.let { genreLabel(s.lang, s.tagOf(it)) } ?: "", color = t.sub, fontSize = 13.sp)
                  }
                  Spacer(Modifier.height(10.dp))
                  ProgressLine(if (goalMs == 0L) 0f else played.toFloat() / goalMs)
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Text(fmtTime(played), color = t.sub, fontSize = 11.sp)
                      Text(fmtTime(goalMs), color = t.sub, fontSize = 11.sp)
                  }
                  Spacer(Modifier.height(6.dp))

                  // Нижняя «зона большого пальца»: дуга кнопок + список «Далее». Зеркалится для левши.
                  val arc: @Composable () -> Unit = { ArcControls(s, s.rightHand, cur, go, launch) }
                  val next: @Composable (Modifier) -> Unit = { m -> UpNext(s, m) }
                  Row(Modifier.fillMaxWidth().height(230.dp)) {
                      if (s.rightHand) { next(Modifier.weight(1f)); arc() } else { arc(); next(Modifier.weight(1f)) }
                  }
                  Spacer(Modifier.height(4.dp))
                  Row(Modifier.fillMaxWidth().padding(bottom = 12.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                      MayChip(tr("Профиль запуска", "Launch profile"), { go(Screen.Profile) }, icon = Icons.Rounded.Tune)
                      MayChip(if (s.rightHand) tr("Правша", "Right hand") else tr("Левша", "Left hand"),
                          { s.setHand(!s.rightHand) }, selected = true, icon = Icons.Rounded.SwapHoriz)
                  }
              }
          }

          private class ArcBtn(
              val icon: androidx.compose.ui.graphics.vector.ImageVector, val r: Float, val a: Float,
              val size: Float = 40f, val active: Boolean = false, val act: () -> Unit,
          )

          @Composable
          private fun ArcControls(s: Store, right: Boolean, cur: GameItem?, go: (Screen) -> Unit, launch: (GameItem) -> Unit) {
              val w = 204f; val h = 230f; val cy = h / 2; val playR = 46f
              val cx = if (right) w - 52f else 52f
              val dir = if (right) -1f else 1f
              val isFav = cur != null && cur.pkg in s.favs
              val btns = listOf(
                  ArcBtn(Icons.Rounded.Shuffle, 80f, 90f) { s.random() },
                  ArcBtn(Icons.Rounded.SkipPrevious, 80f, 45f) { s.prev() },
                  ArcBtn(Icons.Rounded.SkipNext, 80f, 0f) { s.next() },
                  ArcBtn(if (isFav) Icons.Rounded.Favorite else Icons.Rounded.FavoriteBorder, 80f, -45f, active = isFav) { cur?.let { s.favs.toggle(it.pkg) } },
                  ArcBtn(Icons.Rounded.PlaylistAdd, 80f, -90f, active = cur != null && cur.pkg in s.queue) { cur?.let { s.queue.toggle(it.pkg) } },
                  ArcBtn(Icons.Rounded.Search, 132f, 38f, 36f) { go(Screen.Library) },
                  ArcBtn(Icons.Rounded.Waves, 132f, -38f, 36f) { go(Screen.Wave) },
              )
              Box(Modifier.size(w.dp, h.dp)) {
                  btns.forEach { b ->
                      val rad = Math.toRadians(b.a.toDouble())
                      val x = cx + dir * b.r * cos(rad).toFloat() - b.size / 2
                      val y = cy - b.r * sin(rad).toFloat() - b.size / 2
                      SoftButton(b.icon, b.act, Modifier.offset(x.dp, y.dp), size = b.size.dp, active = b.active)
                  }
                  SoftButton(
                      Icons.Rounded.PlayArrow, { cur?.let(launch) },
                      Modifier.offset((cx - playR).dp, (cy - playR).dp), size = (playR * 2).dp, accent = true,
                  )
              }
          }

          @Composable
          private fun UpNext(s: Store, modifier: Modifier) {
              val t = LocalT.current
              Column(modifier.padding(horizontal = 8.dp)) {
                  SectionLabel(tr("Далее", "Up next"))
                  s.upNext(3).forEach { g ->
                      Row(
                          Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(t.card)
                              .clickable { s.select(g.pkg) }.padding(8.dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          GameIcon(g, 34.dp)
                          Spacer(Modifier.width(8.dp))
                          Column {
                              Text(g.name, color = t.text, fontSize = 12.sp, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                              Text(genreLabel(s.lang, s.tagOf(g)), color = t.sub, fontSize = 10.sp, maxLines = 1)
                          }
                      }
                      Spacer(Modifier.height(6.dp))
                  }
                  MayChip(if (s.lang == "ru") s.sort.ru else s.sort.en, { s.cycleSort() }, icon = Icons.Rounded.Sort)
              }
          }

          // ============================ MINI PLAYER ============================

          @Composable
          fun MiniBar(s: Store, launch: (GameItem) -> Unit, onOpen: () -> Unit) {
              val t = LocalT.current
              val cur = s.currentGame() ?: return
              Row(
                  Modifier.fillMaxWidth().padding(vertical = 8.dp).clip(RoundedCornerShape(22.dp)).background(t.card)
                      .clickable(onClick = onOpen).padding(10.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  GameIcon(cur, 40.dp)
                  Spacer(Modifier.width(10.dp))
                  Column(Modifier.weight(1f)) {
                      Text(cur.name, color = t.text, fontSize = 14.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                      Text(genreLabel(s.lang, s.tagOf(cur)), color = t.sub, fontSize = 11.sp)
                  }
                  SoftButton(Icons.Rounded.SkipPrevious, { s.prev() }, size = 36.dp)
                  Spacer(Modifier.width(6.dp))
                  SoftButton(Icons.Rounded.PlayArrow, { launch(cur) }, size = 42.dp, accent = true)
                  Spacer(Modifier.width(6.dp))
                  SoftButton(Icons.Rounded.SkipNext, { s.next() }, size = 36.dp)
              }
          }

          // ============================== LIBRARY ==============================

          @OptIn(ExperimentalFoundationApi::class, ExperimentalLayoutApi::class)
          @Composable
          fun LibraryScreen(s: Store, tab0: Int, go: (Screen) -> Unit, onMenu: () -> Unit, launch: (GameItem) -> Unit) {
              val t = LocalT.current
              var q by remember { mutableStateOf("") }
              var tab by remember(tab0) { mutableIntStateOf(tab0) }
              var edit by remember { mutableStateOf<GameItem?>(null) }
              val tabs = listOf(tr("Все", "All"), tr("Любимое", "Favorites"), tr("Очередь", "Queue"), tr("Скрытые", "Hidden"))
              val byPkg = s.games.associateBy { it.pkg }
              val list = when (tab) {
                  0 -> s.visible()
                  1 -> s.visible().filter { it.pkg in s.favs }
                  2 -> s.queue.items.mapNotNull { byPkg[it] }
                  else -> s.games.filter { it.pkg in s.hidden }
              }.filter { q.isBlank() || it.name.contains(q, ignoreCase = true) }

              Column(Modifier.fillMaxSize()) {
                  BackBar(tr("Библиотека", "Library"), { go(Screen.Hub) }, onMenu)
                  TextField(
                      value = q, onValueChange = { q = it }, singleLine = true,
                      placeholder = { Text(tr("Поиск игры", "Search games")) },
                      leadingIcon = { androidx.compose.material3.Icon(Icons.Rounded.Search, null) },
                      shape = RoundedCornerShape(50), modifier = Modifier.fillMaxWidth(),
