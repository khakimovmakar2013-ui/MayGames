          cat > app/src/main/java/com/may/games/Store.kt <<'MAYEOF_4'
          package com.may.games

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ApplicationInfo
          import android.os.Build
          import android.os.SystemClock
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateListOf
          import androidx.compose.runtime.mutableStateMapOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.core.graphics.drawable.toBitmap
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          class GameItem(val pkg: String, val name: String, val icon: ImageBitmap?, val autoTag: String)

          val GENRES = listOf("Экшен", "Гонки", "RPG", "Головоломки", "Стратегия", "Симулятор", "Шутер", "Инди", "Другое")
          val GENRES_EN = listOf("Action", "Racing", "RPG", "Puzzle", "Strategy", "Simulator", "Shooter", "Indie", "Other")

          enum class Sort(val ru: String, val en: String) {
              ORDER("По порядку", "Default"), NAME("По имени", "By name"),
              TIME("По времени игры", "By playtime"), RECENT("Недавние", "Recent")
          }

          class PkgList(private val sp: SharedPreferences, private val key: String) {
              val items = mutableStateListOf<String>().apply {
                  addAll(sp.getString(key, "")!!.split("|").filter { it.isNotEmpty() })
              }
              private fun save() = sp.edit().putString(key, items.joinToString("|")).apply()
              operator fun contains(p: String) = p in items
              fun toggle(p: String) { if (p in items) items.remove(p) else items.add(p); save() }
              fun remove(p: String) { if (items.remove(p)) save() }
          }

          class Store(private val ctx: Context) {
              private val sp = ctx.getSharedPreferences("may", Context.MODE_PRIVATE)

              var theme by mutableIntStateOf(sp.getInt("theme", 0).coerceIn(0, THEMES.lastIndex)); private set
              var rightHand by mutableStateOf(sp.getBoolean("right", true)); private set
              var lang by mutableStateOf(sp.getString("lang", "ru")!!); private set
              var showAll by mutableStateOf(sp.getBoolean("all", false)); private set
              var sort by mutableStateOf(Sort.valueOf(sp.getString("sort", "ORDER")!!)); private set
              var current by mutableStateOf(sp.getString("cur", null)); private set
              var games by mutableStateOf(listOf<GameItem>()); private set

              val favs = PkgList(sp, "favs")
              val queue = PkgList(sp, "queue")
              val hidden = PkgList(sp, "hidden")
              val playtime = mutableStateMapOf<String, Long>()
              val tags = mutableStateMapOf<String, String>()
              private val lastPlayed = mutableStateMapOf<String, Long>()

              fun setTheme(i: Int) { theme = i; sp.edit().putInt("theme", i).apply() }
              fun setHand(right: Boolean) { rightHand = right; sp.edit().putBoolean("right", right).apply() }
              fun setLang(l: String) { lang = l; sp.edit().putString("lang", l).apply() }
              fun setShowAll(v: Boolean) { showAll = v; sp.edit().putBoolean("all", v).apply() }
              fun cycleSort() {
                  sort = Sort.values()[(sort.ordinal + 1) % Sort.values().size]
                  sp.edit().putString("sort", sort.name).apply()
              }
              fun select(pkg: String) { current = pkg; queue.remove(pkg); sp.edit().putString("cur", pkg).apply() }
              fun setTag(pkg: String, tag: String) { tags[pkg] = tag; sp.edit().putString("tag_$pkg", tag).apply() }
              fun tagOf(g: GameItem) = tags[g.pkg] ?: g.autoTag

              // ---- профиль игры (громкость / яркость при запуске) ----
              fun volume(pkg: String) = sp.getInt("vol_$pkg", -1)
              fun brightness(pkg: String) = sp.getInt("br_$pkg", -1)
              fun saveProfile(pkg: String, vol: Int, br: Int) =
                  sp.edit().putInt("vol_$pkg", vol).putInt("br_$pkg", br).apply()
              var savedBrightness: Int
                  get() = sp.getInt("prev_br", -1)
                  set(v) { sp.edit().putInt("prev_br", v).apply() }

              // ---- загрузка библиотеки ----
              suspend fun refresh() {
                  val list = withContext(Dispatchers.Default) { loadGames() }
                  for (g in list) {
                      playtime[g.pkg] = sp.getLong("pt_${g.pkg}", 0)
                      lastPlayed[g.pkg] = sp.getLong("lp_${g.pkg}", 0)
                      sp.getString("tag_${g.pkg}", null)?.let { tags[g.pkg] = it }
                  }
                  games = list
              }

              private fun loadGames(): List<GameItem> {
                  val pm = ctx.packageManager
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val found = pm.queryIntentActivities(intent, 0).mapNotNull { r ->
                      val ai = r.activityInfo.applicationInfo
                      if (ai.packageName == ctx.packageName) return@mapNotNull null
                      @Suppress("DEPRECATION")
                      val isGame = (ai.flags and ApplicationInfo.FLAG_IS_GAME) != 0 ||
                          (Build.VERSION.SDK_INT >= 26 && ai.category == ApplicationInfo.CATEGORY_GAME)
                      if (!isGame && !showAll) return@mapNotNull null
                      val name = r.loadLabel(pm).toString()
                      val icon = runCatching { pm.getApplicationIcon(ai).toBitmap(96, 96).asImageBitmap() }.getOrNull()
                      GameItem(ai.packageName, name, icon, guessTag(name + " " + ai.packageName))
                  }.distinctBy { it.pkg }
                  return if (found.isEmpty()) demoGames() else found
              }

              private fun guessTag(s: String): String {
                  val x = s.lowercase()
                  return when {
                      listOf("race", "racing", "drift", "car", "moto", "speed", "asphalt").any { it in x } -> "Гонки"
                      listOf("shoot", "gun", "war", "sniper", "strike", "pubg", "cod", "fps").any { it in x } -> "Шутер"
                      listOf("rpg", "legend", "quest", "genshin", "dragon", "hero", "fantasy").any { it in x } -> "RPG"
                      listOf("puzzle", "match", "candy", "block", "word", "sudoku", "2048").any { it in x } -> "Головоломки"
                      listOf("strategy", "clash", "empire", "kingdom", "tower", "defense", "chess").any { it in x } -> "Стратегия"
                      listOf("sim", "farm", "tycoon", "city", "craft").any { it in x } -> "Симулятор"
                      listOf("run", "jump", "ninja", "fight", "action", "battle").any { it in x } -> "Экшен"
                      else -> "Другое"
                  }
              }

              private fun demoGames() = listOf(
                  "Аврора" to "Экшен", "Тихий вечер" to "Головоломки", "Лунный свет" to "RPG",
                  "Горизонт" to "Гонки", "Импульс" to "Шутер", "Личный свет" to "Инди",
                  "Вдохновение" to "Стратегия", "Рассвет" to "Симулятор",
              ).mapIndexed { i, (n, t) -> GameItem("demo.$i", n, null, t) }

              // ---- выборка ----
              fun visible(): List<GameItem> {
                  val base = games.filter { it.pkg !in hidden }
                  return when (sort) {
                      Sort.ORDER -> base
                      Sort.NAME -> base.sortedBy { it.name.lowercase() }
                      Sort.TIME -> base.sortedByDescending { playtime[it.pkg] ?: 0 }
                      Sort.RECENT -> base.sortedByDescending { lastPlayed[it.pkg] ?: 0 }
                  }
              }

              fun currentGame(): GameItem? {
                  val v = visible()
                  return v.firstOrNull { it.pkg == current } ?: v.firstOrNull()
              }

              fun upNext(n: Int): List<GameItem> {
                  val v = visible()
                  val cur = currentGame() ?: return emptyList()
                  val byPkg = v.associateBy { it.pkg }
                  val q = queue.items.mapNotNull { byPkg[it] }
                  val i = v.indexOfFirst { it.pkg == cur.pkg }
                  val rest = (v.drop(i + 1) + v.take(i))
                  return (q + rest).filter { it.pkg != cur.pkg }.distinctBy { it.pkg }.take(n)
              }

              fun setQueue(pkgs: List<String>) {
                  queue.items.clear(); queue.items.addAll(pkgs)
                  sp.edit().putString("queue", pkgs.joinToString("|")).apply()
              }

              fun next() { upNext(1).firstOrNull()?.let { select(it.pkg) } }
              fun prev() {
                  val v = visible(); val cur = currentGame() ?: return
                  val i = v.indexOfFirst { it.pkg == cur.pkg }
                  if (v.size > 1) select(v[(i - 1 + v.size) % v.size].pkg)
              }
              fun random() { visible().filter { it.pkg != current }.randomOrNull()?.let { select(it.pkg) } }

              /** «Моя волна»: игры выбранных жанров, сначала наименее игранные. */
              fun wave(genres: Set<String>): List<GameItem> =
                  visible().filter { genres.isEmpty() || tagOf(it) in genres }
                      .sortedBy { playtime[it.pkg] ?: 0 }

              // ---- сессии ----
              fun recordLaunch(pkg: String) {
                  sp.edit().putString("run_pkg", pkg).putLong("run_at", SystemClock.elapsedRealtime())
                      .putLong("lp_$pkg", System.currentTimeMillis()).apply()
                  lastPlayed[pkg] = System.currentTimeMillis()
              }

              /** Вызывается при возврате в хаб: прибавляет длительность сессии. */
              fun finishSession() {
                  val pkg = sp.getString("run_pkg", null) ?: return
                  val at = sp.getLong("run_at", 0)
                  sp.edit().remove("run_pkg").remove("run_at").apply()
                  val dt = (SystemClock.elapsedRealtime() - at).coerceIn(0, 12L * 3600_000)
                  if (dt < 5_000) return
                  val total = (playtime[pkg] ?: sp.getLong("pt_$pkg", 0)) + dt
                  playtime[pkg] = total
                  sp.edit().putLong("pt_$pkg", total).apply()
              }
          }
