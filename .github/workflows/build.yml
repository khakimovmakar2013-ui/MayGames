          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.lerp

          /** kind: 0 = светлая, 1 = тёмная, 2 = чёрная OLED */
          data class MayTheme(
              val ru: String, val en: String, val kind: Int,
              val bgTop: Color, val bgBottom: Color, val accent: Color,
              val card: Color, val text: Color, val sub: Color,
          )

          private fun light(ru: String, en: String, accent: Long, tint: Long): MayTheme {
              val t = Color(tint)
              val txt = Color(0xFF2A1A22)
              return MayTheme(ru, en, 0, t, lerp(t, Color.White, 0.55f), Color(accent),
                  Color.White.copy(alpha = 0.55f), txt, txt.copy(alpha = 0.55f))
          }

          private fun dark(ru: String, en: String, accent: Long, bg: Long): MayTheme {
              val b = Color(bg)
              return MayTheme(ru, en, 1, b, lerp(b, Color.Black, 0.45f), Color(accent),
                  Color.White.copy(alpha = 0.09f), Color.White, Color.White.copy(alpha = 0.55f))
          }

          private fun oled(ru: String, en: String, accent: Long): MayTheme =
              MayTheme(ru, en, 2, Color.Black, Color.Black, Color(accent),
                  Color.White.copy(alpha = 0.07f), Color.White, Color.White.copy(alpha = 0.5f))

