          /** Обложка с мягкими волнами, как в плеере. */
          @Composable
          fun WaveCover(modifier: Modifier = Modifier, content: @Composable BoxScope.() -> Unit = {}) {
              val t = LocalT.current
              Box(
                  modifier.clip(RoundedCornerShape(28.dp)).background(
                      Brush.linearGradient(listOf(t.accent.copy(alpha = 0.35f), Color(0xFFB9A4FF).copy(alpha = 0.55f), Color(0xFF9FD6FF).copy(alpha = 0.4f)))
                  ),
                  contentAlignment = Alignment.Center,
              ) {
                  Canvas(Modifier.matchParentSize()) {
                      for (k in 0 until 4) {
                          val p = Path()
                          val amp = size.height * (0.06f + 0.02f * k)
                          val base = size.height * (0.45f + 0.1f * k)
                          p.moveTo(0f, base)
                          var x = 0f
                          while (x <= size.width) {
                              p.lineTo(x, base + amp * sin((x / size.width * 2f * PI + k).toFloat()))
                              x += 6f
                          }
                          drawPath(p, Color.White.copy(alpha = 0.45f), style = Stroke(width = 3f))
                      }
                      drawCircle(Color.White.copy(alpha = 0.25f), size.minDimension * 0.18f, Offset(size.width * 0.3f, size.height * 0.3f))
                  }
                  content()
              }
          }

          @Composable
          fun ProgressLine(fraction: Float, modifier: Modifier = Modifier) {
              val t = LocalT.current
              Box(modifier.fillMaxWidth().height(14.dp), contentAlignment = Alignment.CenterStart) {
                  Box(Modifier.fillMaxWidth().height(3.dp).clip(CircleShape).background(t.text.copy(alpha = 0.15f)))
                  BoxWithConstraints(Modifier.fillMaxWidth(), contentAlignment = Alignment.CenterStart) {
                      val w = maxWidth * fraction.coerceIn(0f, 1f)
                      Box(Modifier.width(w).height(3.dp).clip(CircleShape).background(t.accent))
                      Box(Modifier.padding(start = (w - 6.dp).coerceAtLeast(0.dp)).size(12.dp).clip(CircleShape).background(t.accent))
                  }
              }
          }

          fun fmtTime(ms: Long): String {
